<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Database Management System</title>
  <script>
    // If authenticated, go to dashboard; otherwise go to login page
    const isAuthenticated = localStorage.getItem("sms_is_authenticated") === "true";
    if (isAuthenticated) {
      window.location.replace("dashboard.html");
    } else {
      window.location.replace("login.html");
    }
  </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #0f172a; color: #fff;">
  <p>Redirecting to Student Database Management System... <a href="login.html" style="color: #3b82f6;">Click here to sign in</a>.</p>
</body>
</html>
